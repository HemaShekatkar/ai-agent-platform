[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-platform"
version = "0.1.0"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "openai",
    "python-dotenv",
    "pydantic",
    "typing_extensions",
]

[project.optional-dependencies]
dev = [
    "pytest",
    # Tests build httpx.Response objects directly; newer openai releases
    # no longer pull httpx in transitively
    "httpx",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
