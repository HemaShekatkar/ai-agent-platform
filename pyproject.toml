[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-platform"
version = "0.1.0"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "openai",
    "python-dotenv",
    "pydantic",
    "typing_extensions",
    "temporalio",
    "langgraph>=1.2.15",
    # PostgreSQL checkpointer, event inbox and run lock
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "psycopg-pool",
]

[project.optional-dependencies]
dev = [
    "pytest",
    # Tests build httpx.Response objects directly; newer openai releases
    # no longer pull httpx in transitively
    "httpx",
    # Workflow tests drive Temporal's async test environment
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Fail fast with a clear message when run from an environment that lacks
# the project's dev dependencies (pip install -e ".[dev]")
required_plugins = ["pytest-asyncio"]
